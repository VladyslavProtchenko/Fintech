<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40">
  <!-- Cherry icon (scaled to 36x36 centered in 40px height) -->
  <g transform="translate(2, 2) scale(1.125)">
    <!-- Left cherry -->
    <circle cx="10" cy="23" r="7" fill="#be123c"/>
    <!-- Right cherry -->
    <circle cx="22" cy="23" r="7" fill="#be123c"/>
    <!-- Left highlight -->
    <circle cx="8" cy="20" r="2" fill="#fda4af" opacity="0.6"/>
    <!-- Right highlight -->
    <circle cx="20" cy="20" r="2" fill="#fda4af" opacity="0.6"/>
    <!-- Left stem -->
    <path d="M10 16 C10 11 16 9 16 5" stroke="#166534" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- Right stem -->
    <path d="M22 16 C22 11 16 9 16 5" stroke="#166534" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- Leaf -->
    <ellipse cx="20" cy="6.5" rx="4.5" ry="2" fill="#16a34a" transform="rotate(-30 20 6.5)"/>
  </g>
  <!-- Japanese wordmark: チェリー -->
  <text x="52" y="27" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="20" font-weight="700" fill="#be123c">チェリー</text>
</svg>
