name: cherry

services:
  cherry-api:
    build:
      context: ../../
      dockerfile: platforms/cherry/api/Dockerfile
    container_name: cherry-api
    environment:
      NODE_ENV: development
      PORT: 3018
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cherry_db
      JWT_SECRET: cherry-jp-secret-key-32chars-change-in-prod
      JWT_EXPIRES_IN: 7d
      PAYMENT_API_URL: http://payment-service:3004
      PAYMENT_API_KEY: dev-api-key-12345
      PLATFORM_ID: cherry
      FRONTEND_URL: http://cherry.localhost
    networks: [caddy, internal]
    labels:
      caddy: "http://cherry.localhost"
      caddy.handle_path: /api/*
      caddy.handle_path.0_reverse_proxy: "{{upstreams 3018}}"

  cherry-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: cherry-web
    environment:
      API_URL: http://cherry-api:3018
      NEXT_PUBLIC_APP_NAME: チェリー
      NEXT_PUBLIC_APP_URL: http://cherry.localhost
    networks: [caddy, internal]
    labels:
      caddy: "http://cherry.localhost"
      caddy.handle.0_reverse_proxy: "{{upstreams 3019}}"
    depends_on: [cherry-api]

networks:
  caddy:
    external: true
  internal:
    driver: bridge
