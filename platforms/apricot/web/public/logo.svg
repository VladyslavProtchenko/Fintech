<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 40">
  <!-- Apricot icon: round fruit body with leaf on top -->
  <g transform="translate(4, 2)">
    <!-- Fruit body (left half) -->
    <path d="M16,34 C8,34 3,28 3,20 C3,12 8,8 16,8 C16,8 16,34 16,34 Z" fill="#1d4ed8"/>
    <!-- Fruit body (right half) -->
    <path d="M16,34 C24,34 29,28 29,20 C29,12 24,8 16,8 C16,8 16,34 16,34 Z" fill="#1e40af"/>
    <!-- Center crease -->
    <path d="M16,10 C16,10 14,20 16,34" stroke="#fbbf24" stroke-width="1" fill="none" opacity="0.6"/>
    <!-- Leaf -->
    <path d="M16,8 C16,8 12,2 16,0 C20,2 16,8 16,8 Z" fill="#fbbf24"/>
    <!-- Stem -->
    <line x1="16" y1="8" x2="16" y2="5" stroke="#fbbf24" stroke-width="1.5"/>
  </g>
  <!-- Wordmark -->
  <text x="46" y="17" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Абрикос</text>
  <text x="46" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#fbbf24" letter-spacing="2">UA</text>
</svg>
