name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  photo-service:
    name: photo-service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter photo-service lint

      - name: Unit tests
        run: pnpm --filter photo-service test

      - name: E2E tests
        run: pnpm --filter photo-service test:e2e
        env:
          GEMINI_API_KEY: placeholder

  otp-service:
    name: otp-service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter otp-service lint

      - name: Unit tests
        run: pnpm --filter otp-service test

      - name: E2E tests
        run: pnpm --filter otp-service test:e2e
