services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  photo-service:
    build:
      context: .
      dockerfile: apps/photo-service/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - apps/photo-service/.env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/photo_service
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - photo_uploads:/app/apps/photo-service/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  otp-service:
    build:
      context: .
      dockerfile: apps/otp-service/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - apps/otp-service/.env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/otp_service
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: apps/payment-service/Dockerfile
    ports:
      - "3004:3004"
    env_file:
      - apps/payment-service/.env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/payment_service
    depends_on:
      postgres:
        condition: service_healthy

  greenapple-api:
    build:
      context: .
      dockerfile: platforms/greenapple/api/Dockerfile
    ports:
      - "3010:3010"
    env_file:
      - apps/greenapple-api/.env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/greenapple_db
      PAYMENT_API_URL: http://payment-service:3004
    depends_on:
      postgres:
        condition: service_healthy
      payment-service:
        condition: service_started

  greenapple-web:
    build:
      context: platforms/greenapple/web
      dockerfile: Dockerfile
    ports:
      - "3011:3011"
    environment:
      API_URL: http://greenapple-api:3010
      NEXT_PUBLIC_APP_NAME: GreenApple
    depends_on:
      - greenapple-api

  orange-api:
    build:
      context: .
      dockerfile: platforms/orange/api/Dockerfile
    ports:
      - "3012:3012"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/orange_db
      JWT_SECRET: ${ORANGE_JWT_SECRET}
      PAYMENT_API_URL: http://payment-service:3004
      PAYMENT_API_KEY: ${PAYMENT_API_KEY}
      PLATFORM_ID: orange
      FRONTEND_URL: http://localhost:3013
      PORT: 3012
    depends_on:
      postgres:
        condition: service_healthy
      payment-service:
        condition: service_started

  orange-web:
    build:
      context: platforms/orange/web
      dockerfile: Dockerfile
    ports:
      - "3013:3013"
    environment:
      API_URL: http://orange-api:3012
      NEXT_PUBLIC_APP_NAME: Orange Pay
    depends_on:
      - orange-api

volumes:
  postgres_data:
  redis_data:
  photo_uploads:
